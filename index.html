<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLATLAND · Ascension — a journey through the dimensions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='3' y='3' width='10' height='10' fill='none' stroke='%23e7c95f' stroke-width='1.5' transform='rotate(20 8 8)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>

  <div id="gl" class="hidden"></div>
  <canvas id="flat"></canvas>

  <div id="retina-wrap" class="hidden">
    <div id="retina-label">YOUR RETINA — the world, as a being of this dimension truly sees it</div>
    <canvas id="retina" width="480" height="36"></canvas>
  </div>

  <div id="hud">
    <div id="dim-badge" class="d2">2D</div>
    <div>
      <div id="chapter-title">FLATLAND</div>
      <div id="chapter-sub"></div>
    </div>
  </div>

  <div id="nav"></div>
  <div id="hint"></div>
  <div id="panel"></div>
  <div id="choices"></div>

  <div id="dialogue" class="hidden">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="advance">▾</div>
  </div>

  <div id="fader"></div>
  <div id="overlay"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
